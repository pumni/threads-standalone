[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "threads-standalone"
version = "0.1.0"
description = "Private Standalone product bootstrap skeleton"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
threads-local = "threads_platform.standalone.__main__:main"

[dependency-groups]
dev = [
  "pyright",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.uv.build-backend]
module-name = "threads_platform"
module-root = "src"
