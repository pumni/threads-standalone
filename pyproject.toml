[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "threads-standalone"
version = "0.1.0"
description = "Standalone local account, Threads API, and browser tooling"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx2>=2,<3",
    "playwright==1.63.0",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
]

[project.scripts]
threads-local = "threads_platform.standalone.__main__:main"

[dependency-groups]
dev = [
  "pyright",
  "pytest",
  "pytest-asyncio>=0.25,<2",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.uv.build-backend]
module-name = "threads_platform"
module-root = "src"
