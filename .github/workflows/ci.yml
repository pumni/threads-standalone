name: cheap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for secret scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.14"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Pyright
        run: uv run --locked pyright

      - name: Synthetic smoke tests
        run: uv run --locked pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test installed wheel in an isolated environment
        run: >-
          uv run --isolated --no-project
          --with dist/threads_standalone-0.1.0-py3-none-any.whl threads-local --help

      - name: Smoke-test synthetic WorkflowPlan and recurrence from the installed wheel
        env:
          THREADS_STANDALONE_WHEEL_SMOKE: "1"
        run: >-
          uv run --isolated --no-project
          --with dist/threads_standalone-0.1.0-py3-none-any.whl --with pytest --with pytest-asyncio
          pytest
          tests/test_workflow_cli.py::test_cli_workflow_mixed_reads_buffer_exact_output_and_uses_one_http_context
          tests/test_workflow_cli.py::test_cli_workflow_post_success_is_exact_and_never_echoes_text
          tests/test_recurrence_cli.py::test_cli_recurrence_create_list_show_keep_workflow_metadata_private

      - name: Smoke-test mocked API read and journaled mutation from the installed wheel
        run: >-
          uv run --isolated --no-project
          --with dist/threads_standalone-0.1.0-py3-none-any.whl --with pytest --with pytest-asyncio
          pytest tests/test_api_contract.py::test_wheel_smoke_quota_read
          tests/test_mutation_runtime.py::test_success_has_durable_phase_order_exact_text_request_and_one_publish
          tests/test_browser_runtime.py::test_wheel_smoke_browser_read

      - name: Smoke-test synthetic Nurture observe, apply, and insights from the installed wheel
        env:
          THREADS_STANDALONE_WHEEL_SMOKE: "1"
        run: >-
          uv run --isolated --no-project
          --with dist/threads_standalone-0.1.0-py3-none-any.whl --with pytest --with pytest-asyncio
          pytest tests/test_nurture_cli.py::test_wheel_smoke_nurture_observe_apply_and_insights
