name: cheap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: full-history Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for secret scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Scan complete Git history
        run: gitleaks detect --source . --redact --exit-code=2 --log-opts=--all

  quality:
    name: locked QA (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked

      - name: Audit locked runtime dependency tree
        run: uv tree --locked --no-dev

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Pyright
        run: uv run --locked pyright

      - name: Full synthetic test suite
        run: uv run --locked pytest

      - name: One-command synthetic recruitment shortlist demo
        run: uv run --locked python scripts/demo_recruitment_shortlist.py

      - name: Build wheel and source distribution
        run: uv build

      - name: Install wheel with locked dependencies and test outside the checkout
        env:
          PYTHONPATH: ""
          THREADS_STANDALONE_WHEEL_SMOKE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $requirements = Join-Path $env:RUNNER_TEMP 'locked-wheel-smoke-requirements.txt'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $wheel = Get-ChildItem -LiteralPath $dist -Filter 'threads_standalone-0.1.0-*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'built wheel was not found' }
          $env:THREADS_STANDALONE_WHEEL_PATH = $wheel.FullName
          uv export --locked --no-emit-project --output-file $requirements | Out-Null
          $venv = Join-Path $env:RUNNER_TEMP 'wheel-smoke-venv'
          uv venv --python 3.14 $venv
          if ($IsWindows) {
            $python = Join-Path $venv 'Scripts/python.exe'
            $cli = Join-Path $venv 'Scripts/threads-local.exe'
          } else {
            $python = Join-Path $venv 'bin/python'
            $cli = Join-Path $venv 'bin/threads-local'
          }
          uv pip sync --python $python $requirements
          uv pip install --python $python --no-deps $wheel.FullName
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          try {
            & $cli --help
            & $python -m pytest (Join-Path $env:GITHUB_WORKSPACE 'tests')
          } finally {
            Pop-Location
          }
